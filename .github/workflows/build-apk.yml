name: Build APK (own)

# Build APK punya sendiri. Jalan otomatis tiap push, atau manual dari tab Actions.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "variant yang dibuild"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: own-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          chmod +x gradlew
          VARIANT="${{ inputs.variant }}"
          [ -z "$VARIANT" ] && VARIANT="debug"
          echo "Building variant: $VARIANT"
          ./gradlew "assemble${VARIANT^}" --no-daemon \
            -Pandroid.injected.build.abi=arm64-v8a   # HP arm64 saja -> artifact kecil

      - name: List APK hasil build
        run: find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v7
        with:
          name: LibreCuts-${{ inputs.variant || 'debug' }}-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
